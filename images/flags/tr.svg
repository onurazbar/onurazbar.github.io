<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Turkish flag: red background, white crescent and star -->
  <rect width="900" height="600" fill="#E30A17" />

  <!-- Crescent constructed by two circles (white minus red) -->
  <g fill="#fff">
    <circle cx="360" cy="300" r="150" />
  </g>
  <g fill="#E30A17">
    <circle cx="420" cy="300" r="120" />
  </g>

  <!-- Five-pointed star -->
  <g transform="translate(520,300) scale(1)" fill="#fff" stroke="none">
    <polygon points="0,-60 17.6,-18.6 58.8,-18.6 25.6,7.1 36.9,47.6 0,25  -36.9,47.6 -25.6,7.1 -58.8,-18.6 -17.6,-18.6" />
  </g>
</svg>
